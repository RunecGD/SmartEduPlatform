services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartedu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: smartedu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartedu-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartedu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smartedu
      RABBITMQ_DEFAULT_PASS: smartedu
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    container_name: smartedu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartedu
      MINIO_ROOT_PASSWORD: smartedupass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
