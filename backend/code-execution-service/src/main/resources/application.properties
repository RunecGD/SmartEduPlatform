server.port=8082
spring.application.name=code-execution-service
spring.docker.compose.enabled=false

core.service.url=${CORE_SERVICE_URL:http://localhost:8080}
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:4173,http://localhost:5173}
code-execution.work-dir=${CODE_EXECUTION_WORK_DIR:${java.io.tmpdir}/smartedu-code-execution}
code-execution.host-work-dir=${CODE_EXECUTION_HOST_WORK_DIR:}
code-execution.timeout-seconds=5
code-execution.compile-timeout-seconds=30
code-execution.memory-limit-mb=256
code-execution.cpu-limit=500000000
code-execution.pids-limit=64
code-execution.max-output-bytes=65536
code-execution.max-concurrent=2
