server.port=8080
spring.application.name=core
spring.docker.compose.enabled=false

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.token=${AI_SERVICE_TOKEN}
jwt.secret=${JWT_SECRET}
jwt.access-ttl-hours=24
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:smartedu}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:smartedu-materials}
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:4173,http://localhost:5173,http://127.0.0.1:4173}
exam.pass-percent=${EXAM_PASS_PERCENT:60}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.task.scheduling.pool.size=3

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartedu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:smartedu}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
