server.port=8081
spring.application.name=notification-service
spring.docker.compose.enabled=false

core.service.url=${CORE_SERVICE_URL:http://localhost:8080}
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:smartedu}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD}}

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/smartedu_notifications}
